<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Panel del vendedor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../multimedia/img/icono.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style/index.css">
</head>

<body class="bg-light">
    <nav class="navbar navbar-dark encabezado">
        <div class="container">
            <a class="navbar-brand" href="../index.html">
                <img src="../multimedia/img/icono.png" width="60">
                EMPRENDE U
            </a>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="text-center">
            Panel del vendedor
        </h2>
        <div class="card shadow mt-4">
            <div class="card-body">
                <form id="formProducto">
                    <div class="mb-3">
                        <label class="form-label">
                            Nombre del producto
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="nombreProducto">

                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Precio
                        </label>
                        <input
                            type="number"
                            class="form-control"
                            id="precioProducto">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Categoría
                        </label>
                        <select
                            class="form-select"
                            id="categoriaProducto">
                            <option>
                                Comida
                            </option>

                            <option>
                                Joyas
                            </option>

                            <option>
                                Accesorios
                            </option>
                        </select>

                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Descripción
                        </label>
                        <textarea
                            class="form-control"
                            id="descripcionProducto"></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            WhatsApp del vendedor
                        </label>
                        <input
                            type="text"
                            class="form-control"
                            id="whatsappProducto"
                            placeholder="573001112233">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Imagen del producto
                        </label>
                        <input
                            type="file"
                            id="imagenProducto"
                            class="form-control"
                            accept="image/*">
                    </div>

                    <button
                        type="button"
                        class="btn btn-success w-100"
                        id="btnGuardar">
                        Guardar producto
                    </button>
                </form>

                <hr>
                <h3 class="text-center">
                    Mis Productos
                </h3>
                <div id="listaProductos">
                    <p class="text-center">
                        No hay productos registrados.
                    </p>
                </div>
                <hr>

                <div class="d-grid">
                    <button
                        class="btn btn-danger"
                        id="btnCerrarSesion">
                        Cerrar sesión
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="../functions/productos.js"></script>
</body>
</html>
