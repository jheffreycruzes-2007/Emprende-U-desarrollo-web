<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión</title>
    <link rel="shortcut icon" href="../multimedia/img/icono.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style/login.css">

</head>

<body class="bg-light">
    <nav class="navbar navbar-dark encabezado">
        <div class="container">
            <a class="navbar-brand" href="../index.html">
                <img src="../multimedia/img/icono.png" width="60">
                EMPRENDE U
            </a>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="text-center mb-4">
                            Iniciar Sesión
                        </h2>
                        <div class="mb-3">
                            <label class="form-label">
                                Correo
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="correo">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Contraseña
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="password">
                        </div>

                        <button
                            class="btn btn-success w-100"
                            id="btnLogin">
                            Iniciar sesión
                        </button>

                        <hr>
                        <p class="text-center">
                            ¿No tienes una cuenta?
                        </p>

                        <a
                            href="registro.html"
                            class="btn btn-outline-success w-100">
                            Registrarse
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="../functions/auth.js"></script>
</body>
</html>
